<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guided Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the story on the left drives a sticky code pane on the right; the beat at the reading line picks the lines. */
:root {
  --bg: oklch(0.99 0.002 265);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.972 0.003 265);
  --hover: oklch(0.955 0.004 265);
  --border: oklch(0.915 0.004 265);
  --border-strong: oklch(0.85 0.006 265);
  --text: oklch(0.22 0.012 265);
  --text-2: oklch(0.42 0.012 265);
  --text-3: oklch(0.54 0.01 265);
  --accent: oklch(0.54 0.18 277);
  --accent-hover: oklch(0.49 0.18 277);
  --accent-soft: oklch(0.962 0.022 277);
  --accent-line: oklch(0.86 0.06 277);
  --accent-ink: oklch(0.44 0.17 277);
  --on-accent: oklch(0.99 0 0);
  --warn-bg: oklch(0.975 0.035 80);
  --warn-line: oklch(0.86 0.09 78);
  --warn-ink: oklch(0.44 0.1 62);
  --plus: oklch(0.5 0.13 155);
  --minus: oklch(0.53 0.17 25);

  /* the code pane is an editor: dark in both themes */
  --code-bg: oklch(0.205 0.012 268);
  --code-bg-2: oklch(0.235 0.012 268);
  --code-line: oklch(0.31 0.012 268);
  --code-text: oklch(0.91 0.006 268);
  --code-text-2: oklch(0.74 0.01 268);
  --code-text-3: oklch(0.6 0.012 268);
  --code-add: oklch(0.29 0.05 155);
  --code-add-hi: oklch(0.38 0.08 155);
  --code-add-ink: oklch(0.78 0.13 155);
  --code-del: oklch(0.29 0.05 22);
  --code-del-hi: oklch(0.4 0.1 22);
  --code-del-ink: oklch(0.76 0.13 25);
  --code-focus: oklch(0.31 0.065 277);
  --code-focus-ink: oklch(0.86 0.09 277);
  --syn-kw: oklch(0.78 0.13 310);
  --syn-str: oklch(0.8 0.09 200);
  --syn-num: oklch(0.8 0.1 250);
  --syn-typ: oklch(0.82 0.1 75);
  --syn-com: oklch(0.62 0.012 268);
  --shadow: 0 1px 2px oklch(0.2 0.02 265 / 0.07), 0 3px 8px oklch(0.2 0.02 265 / 0.06);

  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --head-h: 3.5rem;
  --story-w: 31rem;
  --r: 8px;
  --r-sm: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.165 0.006 268); --surface: oklch(0.19 0.007 268); --surface-2: oklch(0.18 0.006 268); --hover: oklch(0.225 0.008 268);
    --border: oklch(0.27 0.008 268); --border-strong: oklch(0.34 0.01 268);
    --text: oklch(0.945 0.004 268); --text-2: oklch(0.77 0.01 268); --text-3: oklch(0.64 0.01 268);
    --accent: oklch(0.68 0.15 277); --accent-hover: oklch(0.74 0.14 277); --accent-soft: oklch(0.25 0.045 277); --accent-line: oklch(0.42 0.1 277); --accent-ink: oklch(0.82 0.1 277); --on-accent: oklch(0.16 0.02 277);
    --warn-bg: oklch(0.25 0.04 75); --warn-line: oklch(0.44 0.08 75); --warn-ink: oklch(0.86 0.1 82);
    --plus: oklch(0.76 0.13 155); --minus: oklch(0.74 0.14 25);
    --code-bg: oklch(0.135 0.008 268); --code-bg-2: oklch(0.165 0.008 268); --code-line: oklch(0.25 0.01 268);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 3px 8px oklch(0 0 0 / 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.165 0.006 268); --surface: oklch(0.19 0.007 268); --surface-2: oklch(0.18 0.006 268); --hover: oklch(0.225 0.008 268);
  --border: oklch(0.27 0.008 268); --border-strong: oklch(0.34 0.01 268);
  --text: oklch(0.945 0.004 268); --text-2: oklch(0.77 0.01 268); --text-3: oklch(0.64 0.01 268);
  --accent: oklch(0.68 0.15 277); --accent-hover: oklch(0.74 0.14 277); --accent-soft: oklch(0.25 0.045 277); --accent-line: oklch(0.42 0.1 277); --accent-ink: oklch(0.82 0.1 277); --on-accent: oklch(0.16 0.02 277);
  --warn-bg: oklch(0.25 0.04 75); --warn-line: oklch(0.44 0.08 75); --warn-ink: oklch(0.86 0.1 82);
  --plus: oklch(0.76 0.13 155); --minus: oklch(0.74 0.14 25);
  --code-bg: oklch(0.135 0.008 268); --code-bg-2: oklch(0.165 0.008 268); --code-line: oklch(0.25 0.01 268);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 3px 8px oklch(0 0 0 / 0.25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--head-h) + 1rem); }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 0.9375rem/1.55 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
::selection { background: color-mix(in oklch, var(--accent) 28%, transparent); }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 0.2em; }
a:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -0.015em; }
p { margin: 0; }
code { font-family: var(--mono); font-size: 0.85em; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0.05em 0.3em; overflow-wrap: anywhere; }
.plus { color: var(--plus); }
.minus { color: var(--minus); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 1rem; height: 1rem; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; height: 2rem; padding: 0 0.75rem; border-radius: var(--r-sm);
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 0.8125rem; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: background-color 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
}
.btn:hover { background: var(--hover); }
.btn:active { transform: translateY(0.5px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.lg { min-height: 2.5rem; height: auto; padding: 0.5rem 1.1rem; font-size: 0.875rem; white-space: normal; text-align: left; }
.btn.icon { width: 2rem; padding: 0; }
.kbd { font-family: var(--mono); font-size: 0.7rem; color: var(--text-3); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 0.3rem; line-height: 1.4; }

/* ── header ── */
.head {
  position: sticky; top: 0; z-index: 30; height: var(--head-h);
  display: flex; align-items: center; gap: 0.75rem; padding: 0 1rem;
  background: color-mix(in oklch, var(--bg) 90%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
.crumb { display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex: 1; }
.pr-chip { font-family: var(--mono); font-size: 0.75rem; color: var(--text-3); white-space: nowrap; }
.step-btn {
  display: inline-flex; align-items: center; gap: 0.5rem; min-width: 0; height: 2rem; padding: 0 0.6rem; border-radius: var(--r-sm);
  border: 1px solid transparent; background: transparent; cursor: pointer; font-size: 0.875rem; color: var(--text);
}
.step-btn:hover, .step-btn[aria-expanded="true"] { background: var(--hover); border-color: var(--border); }
.step-btn .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.step-btn .n { color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.step-btn .ico { color: var(--text-3); width: 0.85rem; height: 0.85rem; }
.segs { display: flex; gap: 3px; flex: none; margin-left: 0.25rem; }
.segs a { width: 1.35rem; height: 4px; border-radius: 999px; background: var(--border-strong); }
.segs a.done { background: var(--accent); }
.segs a.changed { background: var(--warn-line); }
.segs a[aria-current="step"] { background: var(--text); }
.head-r { display: flex; align-items: center; gap: 0.4rem; }
.viewed-count { font-size: 0.78rem; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; margin-right: 0.35rem; }
.toast { font-size: 0.78rem; color: var(--text-2); white-space: nowrap; }

/* step menu */
.menu {
  position: absolute; top: calc(var(--head-h) - 0.35rem); left: 1rem; z-index: 40; width: min(26rem, calc(100vw - 2rem));
  max-height: calc(100vh - var(--head-h) - 1rem); overflow-y: auto; padding: 0.4rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow);
}
.menu ol { list-style: none; margin: 0; padding: 0; }
.menu a { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr) auto; gap: 0.7rem; align-items: center; padding: 0.5rem 0.6rem; border-radius: var(--r-sm); text-decoration: none; }
.menu a:hover { background: var(--hover); }
.menu a[aria-current="step"] { background: var(--accent-soft); }
.menu .mt { font-size: 0.86rem; font-weight: 500; line-height: 1.3; }
.menu .mm { font-size: 0.75rem; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.marker { width: 1.25rem; height: 1.25rem; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--border-strong); color: var(--text-3); font-size: 0.7rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.marker .ico { width: 0.75rem; height: 0.75rem; stroke-width: 2.5; }
.marker.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.marker.changed { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }

/* ── step: story + pane ── */
.step { display: grid; grid-template-columns: minmax(0, var(--story-w)) minmax(0, 1fr); min-height: calc(100vh - var(--head-h)); }
.story { padding: 2.5rem 2.25rem 0 clamp(1rem, 3vw, 2.5rem); min-width: 0; }
.pane {
  position: sticky; top: var(--head-h); height: calc(100vh - var(--head-h)); min-width: 0;
  display: flex; flex-direction: column; background: var(--code-bg); color: var(--code-text);
}
.step.enter .story { animation: enter 220ms cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }

.step-title { display: grid; gap: 0.65rem; margin-bottom: 1.75rem; }
.step-title h1 { font-size: 1.625rem; line-height: 1.2; letter-spacing: -0.022em; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.85rem; font-size: 0.8125rem; color: var(--text-3); }
.meta .mono { font-family: var(--mono); font-size: 0.78rem; }
.badge { display: inline-flex; align-items: center; gap: 0.35rem; height: 1.375rem; padding: 0 0.55rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
.badge.core::before { background: var(--text); }
.badge.supporting::before { background: var(--text-2); }
.badge.tests::before, .badge.docs::before, .badge.generated::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }

/* beats */
.beats { display: grid; gap: 0.5rem; padding-bottom: 2rem; }
.beat {
  position: relative; display: grid; gap: 0.55rem; padding: 0.9rem 1rem 1rem; margin: 0 -1rem; border-radius: var(--r);
  color: var(--text-3); cursor: pointer; transition: color 200ms ease-out, background-color 200ms ease-out;
}
.beat:hover { color: var(--text-2); }
.beat.on { color: var(--text); background: var(--surface); box-shadow: 0 0 0 1px var(--border), var(--shadow); cursor: default; }
.beat p { font-size: 1rem; line-height: 1.6; }
.beat .bridge { font-size: 1.125rem; line-height: 1.5; letter-spacing: -0.005em; }
.beat.on .bridge { color: var(--text); }
.beat .intro-more { display: grid; gap: 0.7rem; }
.loc { display: inline-flex; align-items: center; gap: 0.45rem; justify-self: start; max-width: 100%; border: 0; background: transparent; padding: 0; cursor: pointer; color: inherit; font: 500 0.78rem/1.3 var(--mono); }
.loc .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); flex: none; transition: background-color 200ms; }
.beat.on .loc .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.loc .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loc .l { color: var(--text-3); white-space: nowrap; }
.beat.on .loc { color: var(--accent-ink); }
.beat-tools { display: flex; gap: 0.25rem; margin-top: 0.1rem; }
.beat:not(.on) .beat-tools:not(:has(.has-note)) { display: none; }
.note-btn { display: inline-flex; align-items: center; gap: 0.35rem; height: 1.6rem; padding: 0 0.5rem; margin-left: -0.5rem; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-3); font-size: 0.78rem; cursor: pointer; }
.note-btn:hover { background: var(--hover); color: var(--text); }
.note-btn .ico { width: 0.85rem; height: 0.85rem; }
.note-box textarea {
  width: 100%; min-height: 4.5rem; resize: vertical; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  padding: 0.55rem 0.7rem; font: 400 0.875rem/1.5 var(--font);
}
.note-box textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.note-box small { display: block; margin-top: 0.3rem; font-size: 0.72rem; color: var(--text-3); }
.has-note { color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.chip { display: inline-flex; align-items: center; gap: 0.35rem; height: 1.6rem; padding: 0 0.55rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font: 400 0.75rem var(--mono); color: var(--text-2); cursor: pointer; }
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.1rem; }
.checks label { display: grid; grid-template-columns: 1.1rem minmax(0, 1fr); gap: 0.65rem; padding: 0.4rem 0.5rem; margin: 0 -0.5rem; border-radius: var(--r-sm); cursor: pointer; font-size: 0.92rem; line-height: 1.5; }
.checks label:hover { background: var(--hover); }
.checks input { appearance: none; margin: 0.18rem 0 0; width: 1.05rem; height: 1.05rem; border-radius: 4px; border: 1.5px solid var(--border-strong); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.checks input::after { content: ""; width: 0.5rem; height: 0.28rem; border: solid var(--on-accent); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.checks input:checked { background: var(--accent); border-color: var(--accent); }
.checks input:checked::after { opacity: 1; }
.checks input:checked + span { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--border-strong); }
.beat-h { font-size: 0.8125rem; font-weight: 600; color: inherit; }
.cmds { display: grid; }
.cmd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.15rem 0.75rem; align-items: start; padding: 0.6rem 0; }
.cmd + .cmd { border-top: 1px solid var(--border); }
.cmd span { font-size: 0.8rem; font-weight: 500; color: var(--text); grid-column: 1; }
.cmd pre { margin: 0; grid-column: 1; font: 400 0.74rem/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); }
.cmd .btn { grid-column: 2; grid-row: 1 / span 2; height: 1.75rem; }
.snippet { display: none; }
.snip-more { display: block; width: 100%; border: 0; border-top: 1px solid var(--code-line); background: var(--code-bg-2); color: var(--code-text-2); font: 500 0.78rem var(--font); padding: 0.55rem; cursor: pointer; }
.snip-more:hover { color: var(--code-text); }

.step-end { display: grid; gap: 0.75rem; padding: 1.5rem 0 calc(45vh); border-top: 1px solid var(--border); margin-top: 1rem; }
.step-end > small { font-size: 0.78rem; color: var(--text-3); }
.next-cta { gap: 1rem; padding: 0.6rem 1rem 0.65rem 1.1rem; }
.nc-t { display: grid; gap: 0.1rem; }
.nc-t b { font-weight: 500; }
.nc-t small { font-size: 0.78rem; opacity: 0.85; }
.step-end .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.hint { font-size: 0.75rem; color: var(--text-3); display: flex; gap: 0.3rem; align-items: center; flex-wrap: wrap; }

/* ── code pane ── */
.tabs { display: flex; gap: 2px; padding: 0.5rem 0.5rem 0; overflow-x: auto; flex: none; border-bottom: 1px solid var(--code-line); background: var(--code-bg); scrollbar-width: none; }
.tab {
  display: inline-flex; align-items: center; gap: 0.4rem; height: 2rem; padding: 0 0.7rem; border: 0; border-radius: 6px 6px 0 0; background: transparent;
  color: var(--code-text-3); font: 400 0.76rem var(--mono); white-space: nowrap; cursor: pointer;
}
.tab:hover { color: var(--code-text); background: var(--code-bg-2); }
.tab[aria-selected="true"] { color: var(--code-text); background: var(--code-bg-2); box-shadow: inset 0 -2px 0 var(--code-focus-ink); }
.tab .ico { width: 0.8rem; height: 0.8rem; stroke-width: 2.4; color: var(--code-focus-ink); }
.tab.map-tab { font-family: var(--font); }
.tab.mech { color: color-mix(in oklch, var(--code-text-3) 70%, var(--code-bg)); }
.tab.mech[aria-selected="true"], .tab.mech:hover { color: var(--code-text); }
.tabs-wrap { position: relative; flex: none; }
.tabs-more {
  position: absolute; right: 0; top: 0.5rem; bottom: 1px; display: inline-flex; align-items: center; gap: 0.3rem; padding: 0 0.7rem 0 1.25rem; border: 0; cursor: pointer;
  background: linear-gradient(to right, transparent, var(--code-bg) 0.4rem); color: var(--code-text); font: 500 0.75rem var(--font);
}
.tabs-more span { padding: 0.15rem 0.45rem; border-radius: 999px; background: var(--code-line); }
.tabs-more .ico { width: 0.85rem; height: 0.85rem; }
.tab .tc { font: 500 0.66rem/1 var(--font); padding: 0.15rem 0.35rem; border-radius: 999px; background: var(--code-line); color: var(--code-text-2); }
.pane, .pane * { scrollbar-color: var(--code-line) transparent; }
.file-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: center; padding: 0.6rem 0.9rem; background: var(--code-bg-2); border-bottom: 1px solid var(--code-line); flex: none; }
.fb-path { font: 400 0.8rem/1.4 var(--mono); color: var(--code-text); overflow-wrap: anywhere; }
.fb-path .dir { color: var(--code-text-3); }
.fb-range { margin-left: 0.75rem; font: 400 0.74rem var(--font); color: var(--code-text-3); white-space: nowrap; }
.fb-note { font-size: 0.8rem; color: var(--code-text-2); margin-top: 0.1rem; }
.fb-r { display: flex; align-items: center; gap: 0.7rem; }
.fb-stat { font: 400 0.75rem var(--mono); white-space: nowrap; }
.fb-stat .plus { color: var(--code-add-ink); }
.fb-stat .minus { color: var(--code-del-ink); }
.tag-warn { font-size: 0.72rem; font-weight: 500; color: oklch(0.86 0.1 82); border: 1px solid oklch(0.5 0.08 75); border-radius: 4px; padding: 0.05rem 0.35rem; white-space: nowrap; }
.viewed {
  display: inline-flex; align-items: center; gap: 0.45rem; height: 1.75rem; padding: 0 0.6rem 0 0.5rem; border-radius: var(--r-sm);
  border: 1px solid var(--code-line); font-size: 0.78rem; font-weight: 500; color: var(--code-text-2); cursor: pointer; user-select: none; white-space: nowrap;
}
.viewed:hover { color: var(--code-text); border-color: var(--code-text-3); }

    ${tools}</article>`;
}
function stepEndHtml(s) {
  const nx = STEPS[stepIndex(s.id) + 1];
  const left = stepFiles(s.ch).filter((f) => viewState(f) !== "viewed").length;
  return `<div class="step-end">
    <small>${left ? `${plural(left, "file")} in this step not marked viewed` : "Every file in this step is viewed"}</small>
    <div class="row">
      <a class="btn primary lg next-cta" href="#${nx.id}" data-finish="${esc(s.id)}"><span class="nc-t"><b>${left ? `Mark ${plural(left, "file")} viewed and continue` : "Continue"}</b><small>${esc(nx.ch ? `Step ${nx.n}: ${nx.title}` : nx.title)}</small></span>${I.right}</a>
      ${left ? `<a class="btn ghost" href="#${nx.id}">Continue without marking viewed</a>` : ""}
    </div>
    <span class="hint"><span class="kbd">j</span><span class="kbd">k</span> next / previous note <span class="kbd">v</span> mark file viewed <span class="kbd">←</span><span class="kbd">→</span> steps</span>
  </div>`;
}
function paneHtml(s) {
  const fs = stepFiles(s.ch);
  const beats = beatsOf(s.ch);
  const targetsOf = (f) => beats.filter((b) => b.f === f && b.line !== undefined).flatMap((b) => { const t = []; for (let n = b.line; n <= (b.to ?? b.line); n++) t.push(n); return t; });
  return `<div class="tabs-wrap"><div class="tabs" role="tablist" aria-label="Files in this step">
      <button class="tab map-tab" role="tab" type="button" data-tab="__map" aria-selected="false">${I.list}This step</button>
      ${fs.map((f) => tabHtml(f, beats)).join("")}
    </div><button class="tabs-more" id="tabs-more" type="button" hidden><span></span>${I.chev}</button></div>
    <div class="file-bar" id="file-bar" hidden></div>
    <button class="range-more" id="range-more" type="button" hidden><span></span>${I.down}</button>
    <div class="pane-body" id="pane-body">
      <div class="pane-view" data-view="__map">${mapHtml(s.ch)}</div>
      ${fs.map((f) => `<div class="pane-view" data-view="${esc(f.path)}" hidden data-targets="${targetsOf(f).join(",")}"></div>`).join("")}
    </div>`;
}
function tabHtml(f, beats) {
  const n = beats.filter((b) => b.f === f).length;
  const mech = beats.some((b) => b.kind === "noise" && b.files.includes(f));
  return `<button class="tab${mech ? " mech" : ""}" role="tab" type="button" data-tab="${esc(f.path)}" aria-selected="false" title="${esc(f.path)}${mech ? " (mechanical)" : ""}">${viewState(f) === "viewed" ? I.check : ""}${esc(nameOf(f))}${n ? `<span class="tc">${n}</span>` : ""}</button>`;
}
function mapHtml(ch) {
  return `<div class="map"><h2>${plural(stepFiles(ch).length, "file")} in this step</h2>${stepFiles(ch).map((f) => {
    const [dir, name] = splitPath(f.path);
    return `<button class="map-row" type="button" data-open-file="${esc(f.path)}"><span class="vmark${viewState(f) === "viewed" ? " on" : ""}">${viewState(f) === "viewed" ? I.check : ""}</span><span class="mtx"><span class="mp"><span class="dir">${esc(dir)}</span>${esc(name)}</span>${f.note ? `<span class="mn">${inline(f.note)}</span>` : ""}</span><span class="ms"><span class="plus">+${f.adds}</span> <span class="minus">−${f.dels}</span></span></button>`;
  }).join("")}</div>`;
}
function fileBarHtml(f, b) {
  const [dir, name] = splitPath(f.path);
  const st = viewState(f);
  const code = b ? beatsOf(f.ch).filter((x) => x.kind === "code") : [];
  const where = b && b.kind === "code" && b.line !== undefined ? `${lineLabel(b)} · note ${code.indexOf(b) + 1} of ${code.length}` : "";
  return `<div><div class="fb-path"><span class="dir">${esc(dir)}</span>${esc(name)}${where ? `<span class="fb-range">${where}</span>` : ""}</div>${f.note ? `<div class="fb-note">${inline(f.note)}</div>` : ""}</div>
    <div class="fb-r">${st === "changed" ? `<span class="tag-warn">Changed since viewed</span>` : ""}<span class="fb-stat"><span class="plus">+${f.adds}</span> <span class="minus">−${f.dels}</span></span>
    <label class="viewed" title="Mark viewed (v)"><input type="checkbox" data-viewed="${esc(f.path)}" ${st === "viewed" ? "checked" : ""}>Viewed</label></div>`;
}

let paneFile = null;
function showPane(key, range, beat) {
  const body = $("pane-body");
  if (!body) return;
  for (const v of body.querySelectorAll(".pane-view")) v.hidden = v.dataset.view !== key;
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", String(t.dataset.tab === key));
  document.querySelector(`.tab[aria-selected="true"]`)?.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "auto" });
  paintTabFade();
  const view = body.querySelector(`.pane-view[data-view="${CSS.escape(key)}"]`);
  const bar = $("file-bar");
  paneRange = null;
  if (key === "__map") { bar.hidden = true; paneFile = null; body.scrollTop = 0; updateMore(); return; }
  const f = fileByPath.get(key);
  paneFile = f;
  bar.hidden = false; bar.innerHTML = fileBarHtml(f, beat);
  if (!view.dataset.ready) { view.innerHTML = fileDiffHtml(f, (view.dataset.targets || "").split(",").filter(Boolean).map(Number)); view.dataset.ready = "1"; }
  const diff = view.querySelector(".diff");
  for (const el of view.querySelectorAll(".dl.on")) el.classList.remove("on", "first", "last");
  diff?.classList.toggle("focusing", !!range);
  if (range) {
    const on = [...view.querySelectorAll(".dl")].filter((el) => {
      const n = +el.dataset.n;
      if (el.dataset.n) return n >= range[0] && n <= range[1];
      const prev = el.previousElementSibling, next = el.nextElementSibling;
      const pn = prev ? +prev.dataset.n || 0 : 0, nn = next ? +next.dataset.n || 0 : 0;
      return pn >= range[0] - 1 && pn <= range[1] && (nn === 0 || nn <= range[1] + 1) && el.classList.contains("del");
    });
    on.forEach((el) => el.classList.add("on"));
    on[0]?.classList.add("first"); on[on.length - 1]?.classList.add("last");
    for (const fold of view.querySelectorAll(".fold")) if (fold.querySelector(".dl.on")) fold.classList.add("open");
    if (on[0]) {
      const bt = body.getBoundingClientRect().top;
      const top = on[0].getBoundingClientRect().top - bt + body.scrollTop;
      const bottom = on[on.length - 1].getBoundingClientRect().bottom - bt + body.scrollTop;
      const lineH = on[0].offsetHeight || 20;
      const h = bottom - top;
      const y = h <= body.clientHeight - lineH * 4 ? top - Math.min((body.clientHeight - h) / 3, lineH * 6) : top - lineH * 1.5;
      body.scrollTo({ top: Math.max(0, y), behavior: reduced() ? "auto" : "smooth" });
      paneRange = { last: on[on.length - 1], to: range[1] };
    }
  }
  updateMore();
}
let paneRange = null;
// files past the right edge of the tab strip get a solid "+N" control that scrolls to them
function paintTabFade() {
  const t = document.querySelector(".tabs"), more = $("tabs-more");
  if (!t || !more) return;
  const edge = t.getBoundingClientRect().right - more.offsetWidth;
  const hidden = [...t.querySelectorAll(".tab")].filter((x) => x.getBoundingClientRect().right > edge + 2);
  more.hidden = !hidden.length;
  more.querySelector("span").textContent = `+${hidden.length}`;
  more.setAttribute("aria-label", `${plural(hidden.length, "more file")}: ${hidden.map((x) => x.textContent).join(", ")}`);
}
function updateMore() {
  const more = $("range-more"), body = $("pane-body");
  if (!more || !body) return;
  if (!paneRange || paneFile === null) { more.hidden = true; return; }
  const below = paneRange.last.getBoundingClientRect().bottom > body.getBoundingClientRect().bottom - 4;
  more.hidden = !below;
  more.querySelector("span").textContent = `Range continues to L${paneRange.to}`;
}

let activeBeat = null, beatObserver = null;
function activate(id, { fromScroll = false } = {}) {
  if (activeBeat === id && fromScroll) return;
  activeBeat = id;
  for (const el of document.querySelectorAll(".beat")) el.classList.toggle("on", el.dataset.beat === id);
  const s = STEPS[stepIndex(current)];
  if (!s.ch || !wide()) return;
  const b = beatsOf(s.ch).find((x) => x.id === id);
  if (!b) return;
  if (b.kind === "code") showPane(b.f.path, b.line !== undefined ? [b.line, b.to ?? b.line] : null, b);
  else if (b.kind === "noise") showPane(b.files[0].path, null);
  else showPane("__map", null);
}
function viewStep(s) {
  const fs = stepFiles(s.ch);
  const a = fs.reduce((x, f) => x + f.adds, 0), d = fs.reduce((x, f) => x + f.dels, 0);
  return `<div class="step">
    <div class="story">
      <div class="step-title"><h1>${inline(s.ch.title)}</h1><div class="meta"><span class="badge ${s.ch.kind}">${KIND[s.ch.kind]}</span><span>Step ${s.n} of ${R.chapters.length}</span><span>${plural(fs.length, "file")}</span><span class="mono"><span class="plus">+${fmt(a)}</span> <span class="minus">−${fmt(d)}</span></span></div></div>
      <div class="beats">${beatsOf(s.ch).map((b) => beatHtml(b, s.ch)).join("")}</div>
      ${stepEndHtml(s)}
    </div>
    <aside class="pane" aria-label="Code for this step">${paneHtml(s)}</aside>
  </div>`;
}
function wireStep() {
  beatObserver?.disconnect();
  const beats = [...document.querySelectorAll(".beat")];
  beatObserver = new IntersectionObserver((entries) => {
    const hit = entries.filter((e) => e.isIntersecting).sort((x, y) => x.boundingClientRect.top - y.boundingClientRect.top)[0];
    if (hit) activate(hit.target.dataset.beat, { fromScroll: true });
  }, { rootMargin: "-30% 0px -60% 0px" });
  beats.forEach((b) => beatObserver.observe(b));
  $("pane-body")?.addEventListener("scroll", updateMore, { passive: true });
  document.querySelector(".tabs")?.addEventListener("scroll", paintTabFade, { passive: true });
  paintTabFade();
  if (beats[0]) activate(beats[0].dataset.beat);
}
function scrollToBeat(el) {
  const y = el.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.3 + 8;
  window.scrollTo({ top: Math.max(0, y), behavior: reduced() ? "auto" : "smooth" });
  activate(el.dataset.beat);
}

/* ── wrap up ── */
function viewWrap() {
  const viewedN = files.filter((f) => viewState(f) === "viewed").length;
  const done = R.chapters.filter((ch) => stepState(ch) === "done").length;
  const left = R.chapters.map((ch, i) => ({ ch, i, n: stepFiles(ch).filter((f) => viewState(f) !== "viewed").length })).filter((x) => x.n);
  const noteCount = Object.values(S.notes).filter((v) => v && v.trim()).length;
  return `<div class="wrap">
    <h1>${viewedN === files.length ? "Every file viewed" : "Wrap up"}</h1>
    <div class="meta"><span>${viewedN} of ${files.length} files viewed</span><span>${done} of ${R.chapters.length} steps complete</span><span>${plural(noteCount, "note")}</span></div>
    <section class="sec"><h2 class="sec-h">Your review, ready for GitHub</h2>
      <div class="cta"><button class="btn primary lg" type="button" data-copy-notes>Copy review notes</button><small>Markdown with each note pinned to its file and lines</small></div>
      <pre class="md" tabindex="0">${esc(notesMarkdown())}</pre></section>
    ${left.length ? `<section class="sec"><h2 class="sec-h">Still to view</h2><ul class="left-list">${left.map((x) => `<li><a href="#${x.ch.id}">Step ${x.i + 1}: ${inline(x.ch.title)}</a><small>${plural(x.n, "file")}</small></li>`).join("")}</ul></section>` : ""}
    <p class="colophon">Generated ${esc(new Date(DATA.generatedAt).toLocaleString("en-CA", { dateStyle: "short", timeStyle: "short" }))} from ${esc(DATA.baseRef)}…${short(DATA.headSha)}.</p>
  </div>`;
}
function notesMarkdown() {
  const viewedN = files.filter((f) => viewState(f) === "viewed").length;
  const out = [`## Review notes: #${R.number} ${plain(R.title)}`, "", `${viewedN}/${files.length} files viewed at \`${short(DATA.headSha)}\`.`, ""];
  let any = false;
  R.chapters.forEach((ch, i) => {
    const notes = beatsOf(ch).filter((b) => (S.notes[b.id] || "").trim());
    const open = stepFiles(ch).filter((f) => viewState(f) !== "viewed");
    if (!notes.length && !open.length) return;
    any = true;
    out.push(`### Step ${i + 1}: ${plain(ch.title)}`, "");
    for (const b of notes) out.push(b.f ? `- \`${b.f.path}\` ${lineLabel(b)}: ${S.notes[b.id].trim()}` : `- ${S.notes[b.id].trim()}`);
    if (notes.length) out.push("");
    if (open.length) out.push(`Not yet viewed: ${open.map((f) => `\`${f.path}\``).join(", ")}`, "");
  });
  if (!any) out.push("No notes. Every file viewed.");
  return out.join("\n").trim() + "\n";
}

/* ── router ── */
let current = null;
function show(id) {
  const ci = stepIndex(id), s = STEPS[ci];
  current = s.id; activeBeat = null; beatObserver?.disconnect();
  const stage = $("stage");
  stage.innerHTML = s.id === "overview" ? viewOverview() : s.id === "wrap-up" ? viewWrap() : viewStep(s);
  stage.firstElementChild?.classList.add("enter");
  if (s.ch) { S.last = s.id; save(); wireStep(); }
  paintHead(s.id); setMenu(false);
  window.scrollTo({ top: 0, behavior: "auto" });
  stage.focus({ preventScroll: true });
  $("announce").textContent = s.ch ? `Step ${s.n} of ${R.chapters.length}: ${s.title}` : s.title;
}
const fromHash = () => decodeURIComponent(location.hash.slice(1)) || "overview";
window.addEventListener("hashchange", () => show(fromHash()));
const go = (d) => { const i = stepIndex(current) + d; if (i >= 0 && i < STEPS.length) location.hash = STEPS[i].id; };

/* ── interactions ── */
let toastTimer;
const toast = (m) => { $("toast").textContent = m; $("announce").textContent = m; clearTimeout(toastTimer); toastTimer = setTimeout(() => ($("toast").textContent = ""), 2600); };
async function copyText(text, msg) { try { await navigator.clipboard.writeText(text); toast(msg); } catch { toast("Copy was blocked. Select the notes in Wrap up instead."); } }
function setViewed(f, on) {
  if (on) S.viewed[f.path] = f.hash; else delete S.viewed[f.path];
  save();
  const tab = document.querySelector(`.tab[data-tab="${CSS.escape(f.path)}"]`);
  if (tab) tab.outerHTML = tabHtml(f, beatsOf(f.ch)).replace('aria-selected="false"', `aria-selected="${tab.getAttribute("aria-selected")}"`);
  const map = document.querySelector('.pane-view[data-view="__map"]');
  if (map) map.innerHTML = mapHtml(f.ch);
  if (paneFile === f) $("file-bar").innerHTML = fileBarHtml(f, beatsOf(f.ch).find((b) => b.id === activeBeat));
  const end = document.querySelector(".step-end");
  if (end) end.outerHTML = stepEndHtml(STEPS[stepIndex(current)]);
  paintHead(current);
}
document.addEventListener("click", (e) => {
  if (e.target.closest("#tabs-more")) {
    const t = document.querySelector(".tabs");
    t.scrollBy({ left: t.clientWidth * 0.7, behavior: reduced() ? "auto" : "smooth" });
    return;
  }
  if (e.target.closest("#range-more") && paneRange) {
    const body = $("pane-body");
    const y = paneRange.last.getBoundingClientRect().bottom - body.getBoundingClientRect().top + body.scrollTop - body.clientHeight * 0.75;
    body.scrollTo({ top: y, behavior: reduced() ? "auto" : "smooth" });
    return;
  }
  const sm = e.target.closest(".snip-more");
  if (sm) { sm.parentElement.querySelector(".snip-rest").hidden = false; sm.remove(); return; }
  const fb = e.target.closest(".fold-btn");
  if (fb) { const fold = fb.parentElement; fold.classList.toggle("open"); fb.setAttribute("aria-expanded", String(fold.classList.contains("open"))); return; }
  const tab = e.target.closest(".tab");
  if (tab) {
    const first = tab.dataset.tab !== "__map" && [...document.querySelectorAll(".beat")].find((el) => beatsOf(STEPS[stepIndex(current)].ch).find((b) => b.id === el.dataset.beat)?.f?.path === tab.dataset.tab);
    if (first) scrollToBeat(first); else showPane(tab.dataset.tab, null);
    return;
  }
  const of = e.target.closest("[data-open-file]");
  if (of) { if (wide()) showPane(of.dataset.openFile, null); else toast("Open this step on a wider screen to browse whole files."); return; }
  const nb = e.target.closest("[data-note-open]");
  if (nb) { const box = nb.closest(".beat").querySelector(".note-box"); box.hidden = false; box.querySelector("textarea").focus(); return; }
  const fin = e.target.closest("[data-finish]");
  if (fin) { for (const f of stepFiles(STEPS[stepIndex(current)].ch)) if (viewState(f) !== "viewed") S.viewed[f.path] = f.hash; save(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { copyText(cp.dataset.copy, "Command copied"); return; }
  if (e.target.closest("[data-copy-notes]")) { copyText(notesMarkdown(), "Notes copied as Markdown"); return; }
  const beat = e.target.closest(".beat");
  if (beat && !beat.classList.contains("on") && !e.target.closest("a, button, input, textarea, label")) scrollToBeat(beat);
  else if (beat && e.target.closest(".loc")) scrollToBeat(beat);
});
document.addEventListener("change", (e) => {
  const v = e.target.closest("[data-viewed]");
  if (v) { setViewed(fileByPath.get(v.dataset.viewed), v.checked); return; }
  const it = e.target.closest("[data-item]");
  if (it) { const [id, i] = it.dataset.item.split(":"); (S.items[id] ||= [])[+i] = it.checked; save(); }
});
let noteTimer;
document.addEventListener("input", (e) => {
  const n = e.target.closest("[data-note]");
  if (!n) return;
  S.notes[n.dataset.note] = n.value;
  const btn = n.closest(".beat").querySelector(".note-btn");
  const has = !!n.value.trim();
  btn.classList.toggle("has-note", has);
  btn.lastChild.textContent = has ? "Your note" : "Add a note";
  clearTimeout(noteTimer); noteTimer = setTimeout(save, 250);
});
$("copy-btn").addEventListener("click", () => copyText(notesMarkdown(), "Notes copied as Markdown"));
$("prev-btn").addEventListener("click", () => go(-1));
$("next-btn").addEventListener("click", () => go(1));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { setMenu(false); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  else if (e.key === "j" || e.key === "k") {
    const beats = [...document.querySelectorAll(".beat")];
    if (!beats.length) return;
    e.preventDefault();
    const i = beats.findIndex((b) => b.dataset.beat === activeBeat);
    const nx = beats[Math.min(beats.length - 1, Math.max(0, i + (e.key === "j" ? 1 : -1)))];
    scrollToBeat(nx);
  } else if (e.key === "v" && paneFile) {
    e.preventDefault();
    setViewed(paneFile, viewState(paneFile) !== "viewed");
    toast(`${nameOf(paneFile)} ${viewState(paneFile) === "viewed" ? "marked viewed" : "unmarked"}`);
  }
});
$("theme-btn").addEventListener("click", () => {
  const dark = (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("guided-review:theme", dark ? "light" : "dark"); } catch { /* ignore */ }
});
matchMedia("(min-width: 1001px)").addEventListener("change", () => { if (STEPS[stepIndex(current)].ch && activeBeat) activate(activeBeat); });

show(fromHash());
})();
</script>
</body>
</html>
